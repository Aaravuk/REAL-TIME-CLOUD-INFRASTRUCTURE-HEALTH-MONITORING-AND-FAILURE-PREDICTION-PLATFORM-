apiVersion: apps/v1
kind: Deployment

metadata:
  name: metrics-exporter

spec:
  replicas: 1

  selector:
    matchLabels:
      app: metrics-exporter

  template:
    metadata:
      labels:
        app: metrics-exporter

    spec:
      containers:
      - name: exporter

        image: failure-exporter:v2

        imagePullPolicy: Never

        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service

metadata:
  name: metrics-exporter

spec:
  selector:
    app: metrics-exporter

  ports:
  - name: http
    port: 8000
    targetPort: 8000
