apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: metrics-exporter
  namespace: monitoring
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: metrics-exporter

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
